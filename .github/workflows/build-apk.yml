name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: andropods-app
      - uses: actions/upload-artifact@v4
        with:
          name: andropods-debug-apk
          path: andropods-app/app/build/outputs/apk/debug/*.apk
